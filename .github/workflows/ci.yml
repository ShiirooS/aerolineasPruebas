# Build + tests de backend y frontend.
# - Corre en cada push a ramas que no son main y en cada PR hacia main.
# - En main lo invoca deploy.yml (workflow_call) antes de construir el artefacto,
#   así no corre dos veces por el mismo push.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aeroapp
          POSTGRES_PASSWORD: aeroapp
          POSTGRES_DB: aeroapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeroapp -d aeroapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # El contenedor de servicio arranca antes del checkout, así que no puede
      # montar infra/postgres/init: los esquemas se crean aquí.
      - name: Crear esquemas en Postgres
        env:
          PGPASSWORD: aeroapp
        run: psql -h localhost -U aeroapp -d aeroapp -v ON_ERROR_STOP=1 -f infra/postgres/init/01-schemas.sql

      - name: Tests
        run: dotnet test services/catalog/Catalog.slnx

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # --ignore-scripts: ninguna dependencia ejecuta scripts al instalarse.
      - run: npm ci --ignore-scripts

      - name: Tests
        run: npm test -- --watch=false

      - name: Build
        run: npm run build

  # Despliega el artefacto en un AWS Emulator (cuenta "dev") con el mismo
  # script que el pipeline. Así cada PR comprueba que la infraestructura
  # (CloudFormation) y el despliegue siguen funcionando antes de llegar a main.
  aws-deploy-smoke:
    name: Despliegue de prueba (AWS Emulator)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Construir artefacto
        run: |
          (cd web && npm ci --ignore-scripts)
          infra/aws/build-artifact.sh artifact

      - name: Instalar AWS Emulator
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo /tmp/aws-emulator.deb https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest/aws-emulator_amd64.deb
          sudo apt-get install -y /tmp/aws-emulator.deb
          aws-emulator -v
          aws --version

      - name: Desplegar en dev (emulado)
        env:
          RELEASE_VERSION: ${{ github.sha }}
        run: |
          infra/aws/emulator.sh dev start
          infra/aws/deploy.sh dev artifact

      - name: Log del emulador
        if: failure()
        run: cat ~/.aws/emulator/dev.log || true
