AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AeroApp - recursos de UN ambiente. Cada ambiente vive en su propia cuenta AWS
  (aquí: su propio AWS Emulator), así que los nombres de SSM/Secrets/ECR no
  llevan el ambiente; los buckets sí, porque los nombres de S3 son globales.

Parameters:
  EnvName:
    Type: String
    AllowedValues: [dev, qa, preprod, prod]
  AspNetCoreEnvironment:
    Type: String
    AllowedValues: [Development, QA, Preprod, Production]
  ApiBaseUrl:
    Type: String
    Description: URL pública de la API que usa el frontend.

Resources:
  # Destino de los logs de acceso de los otros buckets. Es el bucket que RECIBE
  # los logs: registrarse a sí mismo crearía un bucle de logs (AWS lo
  # desaconseja), por eso no tiene LoggingConfiguration.
  AccessLogsBucket:
    Type: AWS::S3::Bucket # NOSONAR destino de los logs de acceso, ver arriba
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub aeroapp-access-logs-${EnvName}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expirar-logs
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Environment
          Value: !Ref EnvName

  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt AccessLogsBucket.Arn
              - !Sub "${AccessLogsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: AllowS3ServerAccessLogs
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${AccessLogsBucket.Arn}/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # Frontend: el build de Angular + el config.json del ambiente.
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub aeroapp-web-${EnvName}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html # rutas de la SPA
      VersioningConfiguration:
        Status: Enabled # permite volver a la versión anterior de la web
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: web/
      Tags:
        - Key: Environment
          Value: !Ref EnvName

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt WebBucket.Arn
              - !Sub "${WebBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # Releases de la API: cada despliegue sube catalog-api/<versión>.zip.
  # Versionado + Retain: nunca se pierde un release al borrar el stack.
  ReleasesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub aeroapp-releases-${EnvName}
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: releases/
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref EnvName

  ReleasesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReleasesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ReleasesBucket.Arn
              - !Sub "${ReleasesBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # Registro de imágenes para cuando Catalog.Api corra en contenedores (ECS/EKS).
  CatalogApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: aeroapp/catalog-api
      ImageScanningConfiguration:
        ScanOnPush: true
      Tags:
        - Key: Environment
          Value: !Ref EnvName

  # Configuración no secreta (Parameter Store).
  AspNetCoreEnvironmentParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /aeroapp/catalog-api/aspnetcore-environment
      Type: String
      Value: !Ref AspNetCoreEnvironment

  ApiBaseUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /aeroapp/web/api-base-url
      Type: String
      Value: !Ref ApiBaseUrl

  # Credenciales de la base de datos: las genera AWS, nunca pasan por el repo.
  CatalogDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: aeroapp/catalog-api/db
      Description: !Sub Usuario y contraseña de Postgres de Catalog.Api (${EnvName})
      GenerateSecretString:
        SecretStringTemplate: '{"username":"aeroapp"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: Environment
          Value: !Ref EnvName

Outputs:
  AccessLogsBucketName:
    Value: !Ref AccessLogsBucket
  WebBucketName:
    Value: !Ref WebBucket
  ReleasesBucketName:
    Value: !Ref ReleasesBucket
  CatalogApiRepositoryUri:
    Value: !GetAtt CatalogApiRepository.RepositoryUri
  CatalogDbSecretArn:
    Value: !Ref CatalogDbSecret
