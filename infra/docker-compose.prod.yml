# Override para preprod y prod (lo añade env.sh; no se usa en dev ni qa).
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Diferencias con dev/qa:
# - Ningún secreto tiene valor por defecto: si falta en .env.<amb>, compose falla
#   en vez de arrancar con aeroapp/admin.
# - Postgres y Redis solo escuchan en 127.0.0.1 (no quedan expuestos a la red).
# - Redis exige contraseña.
# - Keycloak arranca en modo producción (`start`), no `start-dev`.

services:
  postgres:
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env.<ambiente>}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.<ambiente>}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env.<ambiente>}
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:?Define POSTGRES_PORT}:5432"

  redis:
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env.<ambiente>}"]
    environment:
      # redis-cli lee la contraseña de aquí (la usa el healthcheck).
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env.<ambiente>}
    ports: !override
      - "127.0.0.1:${REDIS_PORT:?Define REDIS_PORT}:6379"

  keycloak:
    restart: always
    # Modo producción. Sin TLS propio: se asume un proxy inverso delante
    # (http habilitado, hostname no estricto) hasta que exista un dominio real.
    command: start --import-realm --http-enabled=true --hostname-strict=false
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Define KEYCLOAK_ADMIN en .env.<ambiente>}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Define KEYCLOAK_ADMIN_PASSWORD en .env.<ambiente>}
