# Un stack por ambiente: AEROAPP_STACK y los *_PORT vienen de infra/.env.<amb>
# (ver env.sh). Sin variables, los valores por defecto son los de dev.
name: ${AEROAPP_STACK:-aeroapp}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${AEROAPP_STACK:-aeroapp}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aeroapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeroapp}
      POSTGRES_DB: ${POSTGRES_DB:-aeroapp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aeroapp} -d ${POSTGRES_DB:-aeroapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${AEROAPP_STACK:-aeroapp}-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: ${AEROAPP_STACK:-aeroapp}-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data

volumes:
  postgres-data:
  keycloak-data:
